# Render blueprint for Studio5 Project Tracker.
# Deploys automatically on every push to the `main` branch on GitHub.
services:
  - type: web
    name: studio5-project-tracker
    runtime: node
    plan: free              # free spins down when idle (first open takes ~30-60s). Use "starter" for always-on.
    region: singapore       # closest Render region to India
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false          # paste in the Render dashboard: your Supabase project URL
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false          # paste in the Render dashboard: the Supabase publishable (anon) key
